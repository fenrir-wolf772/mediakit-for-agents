name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm ci
      - name: Syntax check
        run: npm run check
      - name: CLI smoke test
        run: |
          node bin/mediakit.js probe test/source.mp4
          node bin/mediakit.js reframe test/source.mp4 --mode crop -o outputs/ci-reframe.mp4
          node bin/mediakit.js loudness outputs/ci-reframe.mp4 -o outputs/ci-reframe-loud.mp4 --target-lufs -14
          node bin/mediakit.js check outputs/ci-reframe-loud.mp4 --platform tiktok | grep '"pass": true'
          node bin/mediakit.js svg-animate test/svg-demo.svg --anim test/svg-demo-anim.json --duration 2 --fps 10 --background 0F172A -o outputs/ci-svg.mp4
          node bin/mediakit.js compress test/source.mp4 --quality low -o outputs/ci-compress.mp4
          node bin/mediakit.js compress test/source.mp4 --target-size 1 -o outputs/ci-compress-target.mp4
          node bin/mediakit.js extract-audio test/source.mp4 --whisper -o outputs/ci-whisper.mp3
          node bin/mediakit.js receipt outputs/ci-compress.mp4 -o outputs/ci-receipt.json --platform tiktok
          node bin/mediakit.js burn-captions test/source.mp4 --captions test/captions.srt -o outputs/ci-captions-glow.mp4 --style glow
          node bin/mediakit.js mux test/source.mp4 test/mix-voice.mp3 -o outputs/ci-mux.mp4 --audio-offset 0.5
      - name: MCP test
        run: npm test
