name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # Bound the whole job: run #43036227269 sat 1h3m on a hung apt
    # install (DNS failure resolving security.ubuntu.com) before
    # failing — a stuck job must fail fast instead of burning an hour.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install ffmpeg
        # apt on the runner can HANG for many minutes when DNS fails:
        # run #43036227269 died on security.ubuntu.com, and run
        # #43056155316 never reached attempt 2 of the retry loop —
        # a single apt-get install hung ~17 min until the 20-min job
        # timeout cancelled the job. Bound EVERY apt/curl call with a
        # hard timeout so a hung attempt fails fast and the static
        # fallback is actually reached. The fallback MUST be the
        # BtbN GPL build, not johnvansickle.com: the johnvansickle
        # build has no librsvg decoder, so svg_animate fails on it
        # (run #43060050768: "no decoder found for: svg"). BtbN's
        # GPL build ships librsvg + all filters/encoders MediaKit
        # needs — verified locally (svg_animate renders 2s/20 frames).
        run: |
          APT_OPTS="-o Acquire::Retries=1 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10"
          for i in 1 2 3; do
            timeout 90 sudo apt-get update -qq $APT_OPTS && timeout 120 sudo apt-get install -y -qq $APT_OPTS ffmpeg && break
            echo "apt attempt $i failed, retrying in 10s..."
            sleep 10
          done
          if ! command -v ffmpeg >/dev/null; then
            echo "apt failed 3x — falling back to BtbN static ffmpeg build (with librsvg)"
            curl -fsSL --max-time 300 -o /tmp/ffmpeg.tar.xz https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
            tar -xf /tmp/ffmpeg.tar.xz -C /tmp
            sudo install -m 755 /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /usr/local/bin/ffmpeg
            sudo install -m 755 /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/ffprobe
          fi
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - run: npm ci
      - name: Syntax check
        run: npm run check
      - name: CLI smoke test
        run: |
          node bin/mediakit.js probe test/source.mp4
          node bin/mediakit.js reframe test/source.mp4 --mode crop -o outputs/ci-reframe.mp4
          node bin/mediakit.js loudness outputs/ci-reframe.mp4 -o outputs/ci-reframe-loud.mp4 --target-lufs -14
          node bin/mediakit.js check outputs/ci-reframe-loud.mp4 --platform tiktok | grep '"pass": true'
          node bin/mediakit.js svg-animate test/svg-demo.svg --anim test/svg-demo-anim.json --duration 2 --fps 10 --background 0F172A -o outputs/ci-svg.mp4
          node bin/mediakit.js compress test/source.mp4 --quality low -o outputs/ci-compress.mp4
          node bin/mediakit.js compress test/source.mp4 --target-size 1 -o outputs/ci-compress-target.mp4
          node bin/mediakit.js extract-audio test/source.mp4 --whisper -o outputs/ci-whisper.mp3
          node bin/mediakit.js receipt outputs/ci-compress.mp4 -o outputs/ci-receipt.json --platform tiktok
          node bin/mediakit.js burn-captions test/source.mp4 --captions test/captions.srt -o outputs/ci-captions-glow.mp4 --style glow
          node bin/mediakit.js mux test/source.mp4 test/mix-voice.mp3 -o outputs/ci-mux.mp4 --audio-offset 0.5
          node bin/mediakit.js generate-srt --cues-file test/cues.json -o outputs/ci-gen.srt
          node bin/mediakit.js transcribe test/speech-jfk.flac -o outputs/ci-transcribe.srt 2>&1 | grep -q 'faster-whisper'
          node bin/mediakit.js transcribe test/speech-jfk.flac -o outputs/ci-transcribe-whisper.srt --engine whisper 2>&1 | grep -q 'whisper.cpp'
          node bin/mediakit.js export-gif test/source.mp4 --start 2 --end 4 -o outputs/ci-demo.gif --max-size-mb 2
          node bin/mediakit.js fit test/source.mp4 --duration 5 --max-fps 15 -o outputs/ci-fit15.mp4
          node bin/mediakit.js resize test/source.mp4 --preset 360p -o outputs/ci-resize360.mp4
          ffprobe -v error -show_entries stream=width,height -of csv=p=0 outputs/ci-resize360.mp4 | grep '^640,360$'
          node bin/mediakit.js convert test/source.mp4 --video-codec libx264 --gop-seconds 2 -o outputs/ci-gop.mp4
          ffprobe -v quiet -skip_frame nokey -select_streams v:0 -show_entries frame=pts_time -of csv=p=0 outputs/ci-gop.mp4 | grep -c '^' | grep '^5$'
          node bin/mediakit.js mix test/mix-voice.mp3 --music test/mix-music.mp3 -o outputs/ci-mix-sfx.mp3 --sfx test/sfx-beep.mp3@3
          node bin/mediakit.js concat test/source.mp4@2-5 test/source2.mp4@1-4 -o outputs/ci-concat-trim.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 outputs/ci-concat-trim.mp4 | grep '^6'
          node bin/mediakit.js extract-audio test/stereo-lr.mp3 --channel 0 -o outputs/ci-ch0.mp3
          ffprobe -v error -show_entries stream=channels -of csv=p=0 outputs/ci-ch0.mp3 | grep '^1$'
          node bin/mediakit.js grade test/source.mp4 --preset noir -o outputs/ci-grade.mp4
          node bin/mediakit.js reverse test/scenes-source.mp4 -o outputs/ci-reverse.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 outputs/ci-reverse.mp4 | grep '^10'
          node bin/mediakit.js check test/loud-peak.wav --content --platform tiktok | grep '"name": "content_peaks"'
          node bin/mediakit.js check test/content-black.mp4 --content --start 2 --end 8 | grep '"start_seconds": 2'
      - name: MCP test
        run: npm test
